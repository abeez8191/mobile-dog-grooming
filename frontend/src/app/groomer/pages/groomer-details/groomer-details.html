@if(this.formReady()) {
<form [formGroup]="groomerForm" (submit)="submitForm()">
    <div class="row">
        <div class="col">
            <app-photo-selector [initialPhoto]="this.groomerForm.get('photo')?.value" (photoUpload)="updatePhoto($event);"></app-photo-selector>
        </div>
        <div class="col">
            <div class="row">
                <mat-form-field>
                    <mat-label>First Name</mat-label>
                    <input matInput placeholder="First Name" type="text" formControlName="firstName" autocomplete="off" data-dashlane-disabled-on-field="true" data-dashlane-disabled-on-field="true"/>
                </mat-form-field>
                <mat-form-field>
                    <mat-label>Last Name</mat-label>
                    <input matInput placeholder="Last Name" type="text" formControlName="lastName" autocomplete="off" data-dashlane-disabled-on-field="true"/>
                </mat-form-field>
            </div>
            <div class="row">
                <mat-form-field>
                    <mat-label>Email Address</mat-label>
                    <input matInput placeholder="Email Address" type="text" formControlName="email" autocomplete="off" data-dashlane-disabled-on-field="true"/>
                </mat-form-field>
                <mat-form-field>
                    <mat-label>Phone Number</mat-label>
                    <input matInput placeholder="Phone Number" type="text" formControlName="phoneNumber" autocomplete="off" data-dashlane-disabled-on-field="true"/>
                </mat-form-field>
            </div>
        </div>
    </div>
    <div class="col">
        <h1>Availability</h1>
        <div class="row">
            <app-availability-day day="Sun" [form]="getFormControl('availability.sun')"></app-availability-day>  
            <app-availability-day day="Mon" [form]="getFormControl('availability.mon')"></app-availability-day>
            <app-availability-day day="Tue" [form]="getFormControl('availability.tue')"></app-availability-day>
            <app-availability-day day="Wed" [form]="getFormControl('availability.wed')"></app-availability-day>
            <app-availability-day day="Thu" [form]="getFormControl('availability.thu')"></app-availability-day>
            <app-availability-day day="Fri" [form]="getFormControl('availability.fri')"></app-availability-day>
            <app-availability-day day="Sat" [form]="getFormControl('availability.sat')"></app-availability-day>
        </div>
    </div>
    <div class="row">
        <mat-form-field id="bio-field">
            <mat-label>Public Bio</mat-label>
            <textarea matInput formControlName="bio"></textarea>
            <mat-hint>*Anything entered here will be available to the public.</mat-hint>
        </mat-form-field>
        <div id="submit-buttons">
            <button matButton="outlined" type="button" (click)="cancelAdd()">Cancel</button>
            <button matButton="filled" type="submit">{{isEdit() ? 'Save' : 'Add'}}</button>
        </div>
    </div>
</form>
}
