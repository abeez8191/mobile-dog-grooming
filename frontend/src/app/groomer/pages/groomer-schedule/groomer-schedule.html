<div class="day-viewer-container">
      <div class="header">
        <h2>{{ viewDate() | date: 'fullDate' }}</h2>
      </div>

      <mwl-calendar-day-view
        [viewDate]="viewDate()"
        [events]="events()"
        [dayStartHour]="7"
        [dayEndHour]="20"
        [hourSegments]="2"
        (eventClicked)="onEventClick($event.event)">
      </mwl-calendar-day-view>
    </div>
