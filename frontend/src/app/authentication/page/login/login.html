<div class="row center">
    <h1>Sign In</h1>
</div>
@if( this.errorMessage() ) {
    <div class="row center error">
        {{this.errorMessage()}}
    </div>
}
<form [formGroup]="this.loginForm">
    <div class="row">
        <mat-form-field>
            <mat-label>Username or Email</mat-label>
            <input matInput type="text" formControlName="username" />
        </mat-form-field>
    </div>
    <div class="row">
        <mat-form-field>
            <mat-label>Password</mat-label>
            <input matInput type="password" formControlName="password" />
        </mat-form-field>
    </div>

    <div class="row end-content">
        <app-loading-button [isLoading]="isLoading()" (click)="submit()">Login</app-loading-button>
        <!-- <button matButton="filled" (click)="submit()">Login</button> -->
    </div>
</form>
