@if( showAccountCreation() ) {
    <p>To create an account, please provide an email and password below</p>
    <form [formGroup]="accountCreationForm">
        <div class="row">
            <mat-form-field>
                <mat-label>Email Address</mat-label>
                <input matInput type="email" />
            </mat-form-field>
        </div>
        <div class="row">
            <mat-form-field>
                <mat-label>Password</mat-label>
                <input matInput type="password" />
            </mat-form-field>
        </div>
        <div class="row justify-center">
            <app-loading-button [isLoading]="isSubmitting()" (click)="createAuthentication()">Create</app-loading-button>
        </div>
    </form>
}
@else {
    <p>If you would like to save your information for later, please create an account</p>
    <button matButton="filled" (click)="showAccountCreation.set(true)">Create Account</button>
}
