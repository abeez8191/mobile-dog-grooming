@if( isLoading() ) {
    <mat-spinner></mat-spinner>
}
@else {
    <div class="row">
        <div>
            <button matIconButton (click)="getLastWeek()">
                <mat-icon>keyboard_arrow_left</mat-icon>
            </button>
        </div>
    @for( day of getAvailableDays(); track day) {
        <app-availability-day day="{{day}}" [availability]="getAvailabilityForDay(day)" [duration]="duration()" (select)="selectDate($event)"></app-availability-day>
    }
        <div>
            <button matIconButton (click)="getNextWeek()">
                <mat-icon>keyboard_arrow_right</mat-icon>
            </button>
        </div>
    </div>
}
