<VirtualHost *:80>
    ServerName localhost

    # Remove me when uploading
    <IfModule mod_headers.c>
        Header always set Access-Control-Allow-Origin "*"
        Header always set Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS"
        Header always set Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With, Accept, Origin"
    </IfModule>

    <IfModule mod_rewrite.c>
        RewriteEngine On
        RewriteCond %{REQUEST_METHOD} OPTIONS
        RewriteRule ^(.*)$ $1 [R=204,L]
    </IfModule>


    # Route to Django WSGI file
    WSGIDaemonProcess mobile_dog_grooming_app python-path=/var/www/mobile_dog_grooming_app
    WSGIProcessGroup mobile_dog_grooming_app
    WSGIScriptAlias / /var/www/mobile_dog_grooming_app/config/wsgi.py

    # Grant Apache access to the WSGI file
    <Directory /var/www/mobile_dog_grooming_app/config>
        <Files wsgi.py>
            Require all granted
        </Files>
    </Directory>

    # Serve Django Static Files directly through Apache
    Alias /static/ /var/www/mobile_dog_grooming_app/staticfiles/
    <Directory /var/www/mobile_dog_grooming_app/staticfiles>
        Require all granted
    </Directory>

    # Error logging
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>