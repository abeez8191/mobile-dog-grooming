<VirtualHost *:80>
    ServerName localhost
    ServerAlias localhost

    # Logging
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined

    # Django Backend
    Alias /backend/static/ /var/www/mobile_dog_grooming_app/staticfiles/
    <Directory /var/www/mobile_dog_grooming_app/staticfiles>
        Require all granted
    </Directory>

    Alias /backend/media/ /var/www/mobile_dog_grooming_app/media/
    <Directory /var/www/mobile_dog_grooming_app/media>
        Require all granted
    </Directory>

    # Configure mod_wsgi daemon process for Django
    WSGIDaemonProcess mobile_dog_grooming_app python-path=/var/www/mobile_dog_grooming_app
    WSGIProcessGroup mobile_dog_grooming_app

    # Mount Django WSGI application at /backend
    WSGIScriptAlias /backend /var/www/mobile_dog_grooming_app/config/wsgi.py

    # Grant Apache access to the WSGI file
    <Directory /var/www/mobile_dog_grooming_app/config>
        <Files wsgi.py>
            Require all granted
        </Files>
    </Directory>


    # Angular Frontend Application
    DocumentRoot /var/www/mobile_dog_grooming_frontend/dist/browser

    <Directory /var/www/mobile_dog_grooming_frontend/dist/browser>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        # Enable URL rewriting for Angular HTML5 pushState routing
        RewriteEngine On

        # Do not rewrite requests meant for the Django backend
        RewriteCond %{REQUEST_URI} ^/backend [NC]
        RewriteRule ^ - [L]

        # Serve existing files or directories directly (JS, CSS, etc)
        RewriteCond %{DocumentRoot}%{REQUEST_URI} -f [OR]
        RewriteCond %{DocumentRoot}%{REQUEST_URI} -d 
        RewriteRule ^ - [L]

        # Fallback all other routes to Angular's index.html
        FallbackResource /index.html
    </Directory>
</VirtualHost>