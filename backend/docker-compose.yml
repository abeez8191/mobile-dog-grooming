services:
  db:
    image: postgres
    volumes:
      - db_data:/var/lib/postgresql
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
  web:
    build: .
    volumes:
      - ./apache/apache.conf:/etc/apache2/sites-enabled/apache.conf
      - ./mobile_dog_grooming_app:/var/www/mobile_dog_grooming_app
    ports:
      - "8000:80"
    environment:
      - POSTGRES_NAME=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    depends_on:
      - db
volumes:
  db_data:
